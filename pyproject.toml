[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddmi"
version = "0.2.0"
description = "Directional intervention study of access-limit acknowledgment before and after LoRA adaptation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhammad Aaliyan", email = "aaliyan1230@gmail.com"}]
dependencies = ["numpy>=1.23,<3"]

[project.optional-dependencies]
paper = ["matplotlib>=3.8,<4"]
gpu = [
    "torch>=2.1",
    "transformers>=4.56",
    "accelerate>=0.27",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "peft>=0.17",
]
train = ["trl>=0.23"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ddmi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
